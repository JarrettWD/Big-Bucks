name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned (Dad, 2026-10-10): ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026.
    # Revisit before GitHub retires 24.04 (docs/PROGRESS.md, Stage 5).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the commit email check.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The repo is public: every commit must use a GitHub noreply email.
      - name: Commit emails are GitHub noreply addresses
        run: npm run check:emails

      # Every workflow here and in ops/backup-repo (the private backup repo's copies):
      # actionlint, with shellcheck on each run script, so a shell typo fails CI
      # instead of the 8 am health check or backup (Stage 5).
      - name: Workflows and their scripts check out
        run: npm run check:workflows

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      # Database tests run against a throwaway local Supabase inside the runner.
      # Never against production.
      - name: Start local database (migrations + local seed)
        run: npx supabase db start

      - name: Database tests (pgTAP)
        run: npm run test:db

  # The simulated year, checked to the cent against the independent reference
  # model (stage 3). Runs after the database tests pass, on every push, so a
  # money bug can't get past GitHub even if nobody ran it locally. Like the
  # database tests, it uses a throwaway local Supabase inside the runner; its
  # own guard refuses anything but the local database.
  timemachine:
    needs: test
    # Pinned (Dad, 2026-10-10): ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026.
    # Revisit before GitHub retires 24.04 (docs/PROGRESS.md, Stage 5).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database (migrations + local seed)
        run: npx supabase db start

      - name: Time machine (a simulated year vs the reference model)
        run: npm run timemachine

      - name: Upload the time machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timemachine-report
          path: docs/TIMEMACHINE-REPORT.md
          if-no-files-found: ignore
