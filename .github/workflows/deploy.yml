name: Deploy to GitHub Pages

# For now this runs only when started by hand (Actions tab > Deploy to GitHub
# Pages > Run workflow), and only deploys a main commit that has already passed
# CI. To make it automatic after CI passes on main, see "Switching deploy to
# automatic" in docs/PROGRESS.md: uncomment the workflow_run block below.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Main only. When triggered by CI, only if CI succeeded.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Refuse unless CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&event=push&status=success" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not passed on main for ${DEPLOY_SHA}. Not deploying."
            exit 1
          fi
          echo "CI passed for ${DEPLOY_SHA}."

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app talks to production: its address and anon key come from the repo's
      # Actions variables (Settings > Secrets and variables > Actions > Variables).
      # Both are public by design; row-level security protects the data. Nothing
      # else goes in the app.
      - name: Check the production address and anon key
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY variables (docs/RUNBOOK.md)."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL must be https://<project>.supabase.co, not a local address."; exit 1 ;;
          esac
          # The anon key is a JWT whose role is "anon", or a publishable key. Never the service role.
          role=$(node -e "try { console.log(JSON.parse(Buffer.from(process.argv[1].split('.')[1], 'base64url').toString()).role ?? '') } catch { console.log('') }" "$VITE_SUPABASE_ANON_KEY")
          case "$VITE_SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            sb_secret_*) echo "::error::That's a secret key. The app gets only the anon (publishable) key."; exit 1 ;;
            *) if [ "$role" != "anon" ]; then
                 echo "::error::VITE_SUPABASE_ANON_KEY isn't the anon key. Never put the service role key in the app."; exit 1
               fi ;;
          esac

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
