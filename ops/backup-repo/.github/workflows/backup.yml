name: Backup

# Once a day: a full backup of production, committed to this private repo (Stage 5).
# Git keeps every day's version, so any past day can be got back. Nothing is ever pruned.
#
# It uses the read-only backup_reader login (secret SUPABASE_DB_URL, through
# Supabase's session pooler, with its certificate checked against supabase-ca.crt):
# it can read every table and change nothing, except recording its own result. The
# run fails on purpose, and GitHub emails Dad, when the export is empty or the ledger
# (or any append-only table) has fewer rows than in yesterday's backup. The daily
# commit also keeps this repo's schedules switched on.
#
# The same run makes one normal API request (ping), so the Free project has outside
# activity every day.
#
# Three jobs, so third-party code never shares a job with the token that can push
# (Guard 2, Dad 2026-10-10):
#   take    reads only: npm packages and pg_dump make the backup, handed on as an artifact;
#   commit  can push: no npm, Node or Docker; it lets through only backup files
#           (scripts/check-incoming.sh), into backup/, and pushes;
#   record  reads only: tells the database the backup is safe on GitHub.
# Before them, on GitHub's schedule (the backstop) only, fresh (reads only, git alone)
# stops the run when this morning's backup is already committed.
# Every action is pinned to a commit (a tag can be moved; a commit can't).

on:
  # The morning start (Dad, 2026-10-12): production's own timer starts this workflow at
  # 7:00 am Alberta time (workflow_dispatch, through GitHub's API), because GitHub's schedule
  # fired 8 hours late on Oct 12, 2026, and not at all on Oct 11. The schedule stays as a
  # backstop, after the morning window: 18:37 UTC is 12:37 pm in Alberta, all year (UTC−6).
  # When it does run, it stops early if a backup was committed in the last 12 hours.
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  # The backstop only (GitHub's schedule): was this morning's backup already committed? A
  # started or manual run always backs up. Reads only, and runs no third-party code.
  fresh:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.age.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is the newest backup less than 12 hours old?
        id: age
        run: |
          # Only the bot commits backups, so a bot commit at the top is the newest backup.
          author=$(git log -1 --format=%an)
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$author" = "github-actions[bot]" ] && [ "$age" -lt 43200 ]; then
            echo "A backup was committed $(( age / 60 )) minutes ago (the morning start), so this backstop run stops here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backup in the last 12 hours: the backstop backs up now."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  take:
    needs: fresh
    # Runs when fresh was skipped (a started or manual run) or found no recent backup.
    if: ${{ !cancelled() && needs.fresh.outputs.skip != 'true' }}
    # Pinned (Dad, 2026-10-10): ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026. Revisit before
    # GitHub retires 24.04 (docs/PROGRESS.md, Stage 5).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      message: ${{ steps.take.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left on disk for the packages below.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Exactly the versions in package-lock.json, and none of their install scripts.
      - run: npm ci --ignore-scripts

      - name: Check the settings
        env:
          BACKUP_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$BACKUP_DB_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_DB_URL secret and the SUPABASE_URL and SUPABASE_ANON_KEY variables (docs/RUNBOOK.md in Big-Bucks, 'The daily backup')."
            exit 1
          fi
          # Supabase's CA certificate: every connection checks the server against it (verify-full).
          if ! grep -q "BEGIN CERTIFICATE" supabase-ca.crt 2>/dev/null; then
            echo "::error::supabase-ca.crt is missing from this repo. Download it (RUNBOOK in Big-Bucks, 'Backup setup', step 4)."
            exit 1
          fi
          # Only ever the read-only login: never postgres, never the direct connection.
          case "$BACKUP_DB_URL" in
            postgresql://backup_reader.*@*.pooler.supabase.com:5432/postgres) ;;
            *) echo "::error::SUPABASE_DB_URL must be the session pooler string for backup_reader: postgresql://backup_reader.<project ref>:<password>@<region>.pooler.supabase.com:5432/postgres"; exit 1 ;;
          esac

      - name: Normal API request (keep-alive)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          answer=$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" -d '{}') || answer=""
          if [ "$answer" != '"ok"' ]; then
            echo "::error::Production didn't answer the ping. It may be paused: see RUNBOOK, 'The project paused'."
            exit 1
          fi
          echo "Production answered."

      - name: Take the backup
        id: take
        env:
          BACKUP_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup.ts take .

      - name: Hand it to the commit job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          # It holds the girls' data: kept only until the commit job has it.
          retention-days: 1

  commit:
    needs: take
    if: ${{ !cancelled() && needs.take.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Receive the backup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backup-${{ github.run_id }}
          path: ${{ runner.temp }}/incoming

      - name: Only backup files, into backup/ only
        env:
          INCOMING: ${{ runner.temp }}/incoming
        run: |
          bash scripts/check-incoming.sh "$INCOMING"
          rm -rf backup
          cp -R "$INCOMING" backup
          git add -A backup
          # Belt and braces: the commit may change nothing outside backup/.
          outside=$(git status --porcelain | grep -v '^.. backup/' || true)
          if [ -n "$outside" ]; then
            echo "::error::Something outside backup/ changed, so nothing was committed: $outside"
            exit 1
          fi

      - name: Commit it
        env:
          MESSAGE: ${{ needs.take.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "${MESSAGE:-Backup}"
          git push -q
          echo "${MESSAGE:-Backup}"

  # Only once the backup is safe on GitHub: prelaunch_reset() and the health check rely on this.
  record:
    needs: commit
    if: ${{ !cancelled() && needs.commit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Receive the backup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backup-${{ github.run_id }}
          path: backup

      - name: Record it
        env:
          BACKUP_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup.ts record .
